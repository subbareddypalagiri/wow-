<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f6efe6;--mut:#a39a8e;--card:rgba(22,17,12,.72);--bd:rgba(255,255,255,.11);--acc:#ff7500;--hi:#ffd900;--ease:cubic-bezier(.175,.885,.32,1.275);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.5 Geist,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
#gl{position:fixed;inset:0;width:100%;height:100%;transition:opacity .8s}
body.chatting #gl{opacity:0}body.chatting .veil{background:radial-gradient(ellipse at 50% 108%,rgba(255,117,0,.09),transparent 55%),#0e0c0a;transition:background .8s}#msgs{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.55),transparent 62%),linear-gradient(transparent 70%,rgba(0,0,0,.7))}
.shell{position:relative;height:100%;display:flex}
.app{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
#side{width:248px;flex:none;display:flex;flex-direction:column;gap:2px;padding:16px 12px;background:rgba(10,8,6,.82);backdrop-filter:blur(16px);border-right:1px solid var(--bd);z-index:5;transition:width .3s cubic-bezier(.2,0,0,1),padding .3s cubic-bezier(.2,0,0,1),border-color .3s,transform .35s var(--ease)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px 6px}
.side-head .logo{padding:0}
.side-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:var(--mut);transition:background .15s,color .15s,transform .15s}
.side-btn:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.side-btn:active{transform:scale(.92)}
body.light .side-btn:hover{background:rgba(0,0,0,.06);color:var(--fg)}
body.side-collapsed #side{width:0;padding-left:0;padding-right:0;border-right-color:transparent;overflow:hidden;pointer-events:none}
body.side-collapsed #side *{opacity:0;pointer-events:none;transition:opacity .15s}
body.side-collapsed #menuBtn{display:inline-flex!important;align-items:center}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;color:#d9d1c6;font-size:15px;text-align:left;transition:background .15s,color .15s}
.nv svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nv:hover,.nv.on{background:rgba(255,255,255,.08);color:var(--fg)}
.nv:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.up{margin-left:auto;padding:2px 10px;border-radius:99px;font-size:12px;color:#6fb0ff;background:rgba(80,140,255,.14);border:1px solid rgba(80,140,255,.32)}
#panel{display:none;margin:auto;max-width:440px;padding:0 20px;text-align:center;flex-direction:column;align-items:center;gap:12px}
#panel h2{font:400 40px/1.1 "Instrument Serif",Georgia,serif;margin:0}#panel p{margin:0 0 8px;color:var(--mut)}
body.panel #panel{display:flex}body.panel #hero,body.panel #msgs,body.panel #dock{display:none!important}
@media(max-width:760px){#side{position:fixed;top:0;bottom:0;left:0;width:min(82vw,280px);transform:translateX(-100%);transition:transform .35s var(--ease);padding-top:calc(16px + env(safe-area-inset-top,0px))}body.side-open #side{transform:none;width:min(82vw,280px);padding:16px 12px;pointer-events:auto}body.side-open #side *{opacity:1;pointer-events:auto}header{display:flex!important}#menuBtn{display:inline-flex!important;align-items:center}}
header{display:flex;align-items:center;padding:12px 16px;position:relative;z-index:6}#menuBtn{display:none}
.logo{font:400 26px/1 "Instrument Serif",Georgia,serif;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:radial-gradient(var(--hi),var(--acc));box-shadow:0 0 14px var(--acc)}
nav{display:flex;gap:6px}
.ghost{padding:7px 14px;border-radius:99px;color:var(--mut);transition:.2s;font-size:14px}
.ghost:hover,.ghost:focus-visible{background:rgba(255,255,255,.08);color:var(--fg);outline:0}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#hero{margin:auto;width:100%;max-width:560px;padding:0 16px 8vh;display:flex;flex-direction:column;align-items:center;text-align:center}
body.chatting #hero{display:none}
h1{font:400 clamp(38px,7vw,64px)/1.04 "Instrument Serif",Georgia,serif;margin:0 0 12px;letter-spacing:-.01em;animation:rise 1s var(--ease) both}
.sub{color:var(--mut);margin:0 0 28px;max-width:44ch}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
#slot{width:100%;display:flex;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:rgba(0,0,0,.35);backdrop-filter:blur(8px);font-size:13px;color:var(--mut);transition:.2s}
.chip:hover,.chip:focus-visible{color:var(--fg);border-color:rgba(255,117,0,.6);outline:0}
#msgs{display:none;flex:1;min-height:0;overflow-y:auto;width:100%;max-width:720px;margin:0 auto;padding:12px 20px 24px;flex-direction:column;gap:28px}
body.chatting #msgs{display:flex}
.m{display:flex;gap:12px;animation:rise .5s var(--ease) both}
.m.u{justify-content:flex-end}
.m.u .b{background:rgba(255,117,0,.1);border:1px solid rgba(255,117,0,.24);border-radius:20px 20px 6px 20px;padding:10px 16px;max-width:80%;font-size:15.5px;line-height:1.55}
.m.a .av{flex:none;width:26px;height:26px;border-radius:50%;margin-top:2px;background:radial-gradient(var(--hi),var(--acc) 60%,#7a2c00);box-shadow:0 0 18px rgba(255,117,0,.5)}
.m.a .b{font:400 16.5px/1.75 Geist,system-ui,sans-serif;color:#ece4d9;letter-spacing:.003em;max-width:600px;white-space:normal}
.m .imgs{display:flex;gap:6px;margin-bottom:8px}.m .imgs img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:p 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes p{50%{opacity:.2;transform:translateY(-3px)}}
#dock{padding:0 16px 14px;display:none;justify-content:center}
body.chatting #dock{display:flex}
.note{font-size:12px;color:var(--mut);text-align:center;padding:0 0 12px}
body:not(.chatting) .note{display:none}
/* prompt input */
.pi{position:relative;width:100%;max-width:320px;transition:max-width .4s var(--ease);text-align:left}
.pi.exp{max-width:480px}
.trayw{height:0;overflow:hidden;margin:0 20px;transition:height .4s var(--ease);position:relative;z-index:0}
.tray{height:68px;display:flex;gap:8px;padding:8px;border:1px solid var(--bd);border-bottom:0;border-radius:16px 16px 0 0;background:#1b1510;overflow-x:auto}
.th{position:relative;flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);transition:transform .2s var(--ease)}
.th:hover{transform:scale(1.05)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.75);font-size:10px;line-height:16px;text-align:center;opacity:0;transition:.2s}
.th:hover b{opacity:1}
.card{position:relative;z-index:1;height:48px;border-radius:24px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.5);transition:height .4s var(--ease),border-color .2s;overflow:hidden;cursor:text}
.pi.exp .card{overflow:visible}
.card:focus-within{border-color:rgba(255,117,0,.55);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 0 3px rgba(255,117,0,.12)}
textarea{position:absolute;top:0;left:0;right:0;width:100%;height:68px;resize:none;border:0;outline:0;background:none;color:var(--fg);font:500 14px/22px Geist,sans-serif;padding:13px 52px 13px 18px;transition:height .15s ease-out}
textarea::placeholder{color:var(--mut)}
.bar{position:absolute;left:10px;right:52px;bottom:8px;display:flex;align-items:center;opacity:0;transform:translateY(8px);filter:blur(4px);pointer-events:none;transition:.3s var(--ease)}
.pi.exp:not(.rec) .bar{opacity:1;transform:none;filter:none;pointer-events:auto}
.tb{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;color:var(--mut);font-size:12px;font-weight:600;transition:.2s}
.tb:hover,.tb.on,.tb:focus-visible{background:rgba(255,255,255,.09);color:var(--fg);outline:0}
.tb.plus{margin-left:auto;width:28px;height:28px;justify-content:center;padding:0}
.k{display:inline-block;animation:pop .3s var(--ease)}@keyframes pop{from{opacity:0;transform:scale(.9)}}
.dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(var(--hi),var(--acc))}
.menu{display:flex;flex-direction:column;gap:2px;position:absolute;bottom:calc(100% + 8px);left:0;width:176px;padding:4px;border-radius:16px;border:1px solid var(--bd);background:rgba(24,18,13,.96);backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.6);opacity:0;transform:scale(.95) translateY(10px);transform-origin:bottom left;pointer-events:none;transition:.3s var(--ease)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:32px;position:relative;padding:0 10px;border-radius:12px;font-size:13px;color:#d8cfc3;text-align:left}
.menu .hl{position:absolute;left:4px;right:4px;top:4px;height:32px;border-radius:12px;background:rgba(255,255,255,.09);opacity:0;pointer-events:none;transition:transform .3s var(--ease),opacity .15s}
.menu button:focus-visible{background:rgba(255,255,255,.09);outline:0}
.menu button[aria-checked=true]{color:var(--hi)}
.wave{position:absolute;right:52px;bottom:8px;height:32px;display:flex;align-items:center;gap:3px;width:0;opacity:0;overflow:hidden;transition:.4s var(--ease)}
.pi.rec .wave{width:40px;opacity:1}.wave i{width:4px;border-radius:4px;background:var(--acc);transition:height .1s;height:4px}
#act{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--hi),var(--acc));color:#1a0d00;transition:transform .2s,filter .2s;display:grid;place-items:center}
#act:hover{filter:brightness(1.1);transform:scale(1.06)}#act:focus-visible{outline:2px solid #fff;outline-offset:2px}
#act svg{grid-area:1/1;transition:.3s var(--ease);opacity:0;transform:scale(.4) rotate(40deg)}
#act[data-s=mic] .i-mic,#act[data-s=send] .i-send,#act[data-s=stop] .i-stop{opacity:1;transform:none}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none}
#lb img{position:fixed;object-fit:cover;border-radius:20px;transition:all .45s var(--ease)}
@media(max-width:560px){header{padding:14px 16px}#hero{padding-bottom:4vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#hist{margin-top:14px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto}
.hh{padding:6px 10px;font-size:12px;color:var(--mut);letter-spacing:.04em}
.hi{flex:1;min-width:0;padding:8px 10px;border-radius:10px;font-size:14px;color:#c9c0b4;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.hr{display:flex;align-items:center;border-radius:10px;transition:background .15s}
.hr:hover,.hr.on{background:rgba(255,255,255,.08)}.hr:hover .hi,.hr.on .hi{color:var(--fg)}
.hi:focus-visible,.ha:focus-visible,.hin:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.ha{flex:none;width:30px;height:30px;margin-right:2px;display:none;align-items:center;justify-content:center;border-radius:8px;color:var(--mut);transition:background .15s,color .15s}
.ha svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ha:hover{color:var(--fg);background:rgba(255,255,255,.1)}.ha.arm{color:#ff6b5a;background:rgba(255,90,70,.18)}
.hr:hover .ha,.hr:focus-within .ha,.hr.on .ha{display:flex}@media(hover:none){.ha{display:flex}}
.hin{flex:1;min-width:0;margin:3px 6px;padding:5px 8px;border-radius:8px;border:1px solid rgba(255,117,0,.5);background:rgba(0,0,0,.4);color:var(--fg);font:inherit;font-size:16px}
body.chatting .pi,body.chatting .pi.exp{max-width:680px}
#scrim{display:none}
*{-webkit-tap-highlight-color:transparent}
@media(max-width:760px){
html{height:100dvh}
#side{z-index:20;width:min(82vw,300px);box-shadow:20px 0 60px rgba(0,0,0,.6);overflow-y:auto}
#scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
body.side-open #scrim{opacity:1;pointer-events:auto}
textarea{font-size:16px}
#msgs{padding:8px 16px 20px;gap:24px}
.m.u .b{max-width:88%}.m.a .b{max-width:100%;font-size:16px}
#dock{padding:0 12px 10px}

}

.m{flex-wrap:wrap;row-gap:2px}
.m.a .b p{margin:0 0 .75em}.m.a .b p:last-child{margin:0}
.m.a .b ul,.m.a .b ol{margin:0 0 .75em;padding-left:1.3em}.m.a .b li{margin:.2em 0}

.acts{flex-basis:100%;display:flex;gap:2px;opacity:0;transition:opacity .2s;padding-left:38px}.m.u .acts{justify-content:flex-end;padding-left:0}
.m:hover .acts,.m:focus-within .acts,.m:last-child .acts{opacity:1}@media(hover:none){.acts{opacity:1}}
.ab{padding:4px 9px;border-radius:8px;font-size:12px;color:var(--mut);transition:background .15s,color .15s}.ab:hover,.ab:focus-visible{background:rgba(255,255,255,.09);color:var(--fg);outline:0}.ab.pri{background:var(--acc);color:#1a0d00;font-weight:600}

#jump{position:fixed;left:calc(50% + 124px);transform:translateX(-50%) translateY(8px);bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:6;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.25s}
#jump.show{opacity:1;transform:translateX(-50%);pointer-events:auto}body:not(.chatting) #jump{display:none}

.tg{display:flex;gap:10px;align-items:center;color:var(--mut)}.kb{font-size:12px}

#apiBtn{margin-left:auto;max-width:60vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg);border:1px solid var(--bd);background:rgba(255,255,255,.05)}

@keyframes apin{from{opacity:0;transform:translateY(14px) scale(.98)}}

  Object.keys(PREM).forEach(k=>delete PREM[k]);Object.keys(MI).forEach(k=>delete MI[k]);
  out.forEach(n=>MI[n]={g:'Free Models'});
  PV.forEach(p=>{
    const ms=BK.models[p.id]||(BK.keys[p.id]&&p.s?p.s:[]);
    if(ms&&ms.length){
      ms.forEach(mId=>{
        let nm=mId;if(seen.has(nm))nm+=' · '+p.n;if(seen.has(nm))return;
        seen.add(nm);out.push(nm);MI[nm]={g:p.n+' (Free)',pid:p.id,model:mId,byok:true};
      });
    }
  });
  SRV.forEach(m=>{
    let nm=m.label||m.id;if(seen.has(nm))nm+=' · '+m.group;if(seen.has(nm))return;
    seen.add(nm);out.push(nm);MI[nm]={g:m.group+' (Server)',id:m.id};PREM[nm]=m.estCredits;
  });
  models.length=0;out.forEach(n=>models.push(n));
}

async function callOne(p,key,model,msgs,signal,cb){
const headers={'Content-Type':'application/json',Authorization:'Bearer '+key};
if(p.id==='openrouter'){headers['HTTP-Referer']=window.location.origin||'http://localhost:3000';headers['X-Title']='Ember'}
const r=await fetch(p.b+'/chat/completions',{method:'POST',signal,headers,body:JSON.stringify({model,messages:msgs,stream:true})});
if(!r.ok){let t='';try{t=(await r.text()).slice(0,120)}catch{}throw new Error(r.status+' '+t)}
const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split(/\r?\n/);buf=ls.pop();
for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')return;try{const j=JSON.parse(d);const t=j.choices?.[0]?.delta?.content;if(t)cb(t)}catch{}}}}

try{await callOne(p,key,model,msgs,opt.signal,t=>{out+=t;opt.onText&&opt.onText({text:out,delta:t})});
if(!out)throw{code:'failed'};return{text:out}}
catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled',text:out};if(out)return{text:out};throw e}};
